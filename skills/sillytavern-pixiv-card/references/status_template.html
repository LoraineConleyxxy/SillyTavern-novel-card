<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg-shell: #0a141d;
    --bg-card: #112130;
    --mint-main: #00e5c3;
    --mint-soft: rgba(0, 229, 195, 0.14);
    --sky-main: #38bdf8;
    --amber-soft: rgba(251, 191, 36, 0.16);
    --amber-line: rgba(251, 191, 36, 0.48);
    --coral: #fb7185;
    --txt-hi: #eaf6fb;
    --txt-sec: #9dc0d4;
    --txt-dim: #66889e;
    --border-line: rgba(0, 229, 195, 0.32);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    color: var(--txt-hi);
    line-height: 1.5;
  }
  .lulu-bar {
    background: linear-gradient(150deg, #0b1620 0%, #0f1f2d 60%, #0c1926 100%);
    border: 1.5px solid var(--border-line);
    border-radius: 14px;
    padding: 11px 14px;
    box-shadow: 0 8px 24px rgba(3, 9, 15, 0.45);
  }
  .lb-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .lb-left {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px;
  }
  .lb-code {
    background: linear-gradient(135deg, var(--mint-main), var(--sky-main));
    color: #041518;
    font-size: 11px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .lb-title {
    font-size: 13px;
    font-weight: 800;
    color: #ffffff;
  }
  .lb-chip {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg-card);
    border: 1px solid rgba(56, 189, 248, 0.24);
    color: var(--txt-sec);
  }
  .lb-chip.pace {
    background: var(--mint-soft);
    border-color: rgba(0, 229, 195, 0.4);
    color: #99f6e4;
    font-weight: 700;
  }
  .lb-chip.comp {
    background: var(--amber-soft);
    border-color: var(--amber-line);
    color: #fde68a;
    font-weight: 700;
    max-width: 220px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .lb-chip.alert {
    background: rgba(251, 113, 133, 0.16);
    border-color: rgba(251, 113, 133, 0.48);
    color: #fecdd3;
    font-weight: 700;
  }
  .lb-btns {
    display: flex;
    gap: 6px;
  }
  .w-btn {
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid var(--border-line);
    background: var(--bg-card);
    color: var(--txt-hi);
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .w-btn:hover:not(:disabled) {
    border-color: var(--mint-main);
    color: var(--mint-main);
  }
  .w-btn.primary {
    background: linear-gradient(135deg, var(--mint-main), #0284c7);
    border-color: transparent;
    color: #041517;
    font-weight: 800;
  }
  .w-btn:disabled {
    opacity: 0.42;
    cursor: not-allowed;
  }

  .prog-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 8px 0 9px;
  }
  .prog-bar {
    flex: 1;
    height: 5px;
    background: rgba(56, 189, 248, 0.14);
    border-radius: 999px;
    overflow: hidden;
  }
  .prog-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--mint-main), var(--sky-main));
    border-radius: 999px;
  }
  .prog-txt {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--txt-dim);
    white-space: nowrap;
  }

  .lb-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 7px;
  }
  .lb-cell {
    background: var(--bg-card);
    border: 1px solid rgba(56, 189, 248, 0.16);
    border-radius: 9px;
    padding: 6px 9px;
    min-width: 0;
  }
  .lb-cell.comp-active {
    border-color: rgba(251, 191, 36, 0.36);
    background: linear-gradient(145deg, #132332 0%, #19242e 100%);
  }
  .ck {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--mint-main);
    margin-bottom: 2px;
  }
  .lb-cell.comp-active .ck {
    color: #fde68a;
  }
  .cv {
    font-size: 11.5px;
    color: var(--txt-hi);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .lb-drawer {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--border-line);
    display: none;
    flex-direction: column;
    gap: 9px;
  }
  .lb-drawer.open { display: flex; }
  .d-head {
    font-size: 11px;
    font-weight: 800;
    color: var(--mint-main);
  }
  .ev-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
    gap: 7px;
  }
  .ev-item {
    text-align: left;
    background: var(--bg-card);
    border: 1px solid rgba(56, 189, 248, 0.16);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 11px;
    color: var(--txt-sec);
    cursor: pointer;
    font-family: inherit;
    transition: border-color 0.14s, background 0.14s;
  }
  .ev-item:hover {
    border-color: var(--sky-main);
  }
  .ev-item.active {
    border-color: var(--mint-main);
    background: #142b3d;
    color: #ffffff;
    font-weight: 600;
  }
  .ev-tag {
    font-size: 10px;
    font-weight: 800;
    color: var(--sky-main);
    margin-bottom: 2px;
  }
  .ev-item.active .ev-tag {
    color: var(--mint-main);
  }
  .comp-box {
    background: rgba(8, 16, 24, 0.85);
    border: 1px solid rgba(251, 191, 36, 0.3);
    border-radius: 9px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .protag-box {
    background: rgba(8, 16, 24, 0.85);
    border: 1px solid rgba(0, 229, 195, 0.3);
    border-radius: 9px;
    padding: 8px 10px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .comp-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .comp-lbl {
    font-size: 11px;
    font-weight: 800;
    color: #fde68a;
  }
  .protag-lbl {
    font-size: 11px;
    font-weight: 800;
    color: var(--mint-main);
  }
  .comp-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .c-pill {
    padding: 2px 8px;
    border-radius: 999px;
    border: 1px solid rgba(251, 191, 36, 0.35);
    background: var(--bg-card);
    color: #fde68a;
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .c-pill:hover {
    background: rgba(251, 191, 36, 0.2);
  }
  .c-pill.clear {
    border-color: rgba(157, 192, 212, 0.3);
    color: var(--txt-sec);
  }
  .comp-in {
    width: 100%;
    padding: 5px 9px;
    border-radius: 7px;
    border: 1px solid rgba(251, 191, 36, 0.38);
    background: #060d14;
    color: var(--txt-hi);
    font-size: 11.5px;
    font-family: inherit;
  }
  .protag-row {
    display: grid;
    grid-template-columns: 150px 1fr;
    gap: 6px;
  }
  .protag-in {
    width: 100%;
    padding: 5px 9px;
    border-radius: 7px;
    border: 1px solid rgba(0, 229, 195, 0.35);
    background: #060d14;
    color: var(--txt-hi);
    font-size: 11.5px;
    font-family: inherit;
  }
  .comp-in::placeholder, .protag-in::placeholder {
    color: var(--txt-dim);
  }
  .jump-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
  }
  .jump-sel {
    flex: 1;
    min-width: 190px;
    padding: 5px 9px;
    border-radius: 8px;
    border: 1px solid var(--border-line);
    background: #081018;
    color: var(--txt-hi);
    font-size: 11.5px;
  }
  .step-sel {
    width: 124px;
    padding: 5px 8px;
    border-radius: 8px;
    border: 1px solid var(--border-line);
    background: #081018;
    color: var(--txt-hi);
    font-size: 11.5px;
  }
  .prev-card {
    background: #081018;
    border: 1px solid rgba(56, 189, 248, 0.18);
    border-radius: 8px;
    padding: 7px 9px;
    font-size: 11px;
    color: var(--txt-sec);
    line-height: 1.48;
  }
  .cfg-bar {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 11.5px;
    color: var(--txt-sec);
  }
  .num-box {
    width: 52px;
    padding: 3px 6px;
    border-radius: 6px;
    border: 1px solid var(--border-line);
    background: #081018;
    text-align: center;
    color: var(--txt-hi);
  }
  .lb-note {
    font-size: 11px;
    font-weight: 600;
    color: var(--mint-main);
    margin-top: 5px;
    min-height: 14px;
  }

  @media (max-width: 620px) {
    .lb-grid { grid-template-columns: 1fr; }
    .ev-row { grid-template-columns: 1fr; }
    .protag-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="lulu-bar">
  <textarea id="rawStatus" style="display:none">$1</textarea>

  <div class="lb-top">
    <div class="lb-left">
      <span id="bCode" class="lb-code">N01.1</span>
      <span id="bTitle" class="lb-title">开箱激活·权限接管</span>
      <span id="bLoc" class="lb-chip">顶层公寓</span>
      <span id="bView" class="lb-chip">第三人称</span>
      <span id="bComp" class="lb-chip comp" style="display:none"></span>
      <span id="bRound" class="lb-chip pace">本幕 1 / 8 回合 · 阶段 1/4</span>
    </div>
    <div class="lb-btns">
      <button id="drawerBtn" type="button" class="w-btn">调度 ▾</button>
      <button id="nextBtn" type="button" class="w-btn primary">下一幕 ▶</button>
    </div>
  </div>

  <div class="prog-row">
    <div class="prog-bar"><div id="pFill" class="prog-fill" style="width: 5%;"></div></div>
    <div id="pTxt" class="prog-txt">1 / 84</div>
  </div>

  <div class="lb-grid">
    <div class="lb-cell"><div class="ck">👗 穿搭与硬件</div><div id="vAttire" class="cv"></div></div>
    <div class="lb-cell"><div class="ck">🧠 状态遥测</div><div id="vMental" class="cv"></div></div>
    <div id="compCell" class="lb-cell"><div class="ck">👥 跨幕同行女伴</div><div id="vComp" class="cv"></div></div>
    <div class="lb-cell"><div class="ck">⏭ 下一日程</div><div id="vNext" class="cv"></div></div>
  </div>

  <div id="drawerBox" class="lb-drawer">
    <div class="comp-box">
      <div class="comp-top">
        <span class="comp-lbl">👥 跨幕随行同伴（点「下一幕 / 跳转」自动找合理借口全程带入新场景）</span>
        <div class="comp-pills">
          <button type="button" class="c-pill" data-add="希蓉（阿斯兰蒂公使·二号副耳钉同场随行）">＋希蓉</button>
          <button type="button" class="c-pill" data-add="燕芝（知性助教·副机同调随行）">＋燕芝</button>
          <button type="button" class="c-pill" data-add="张雁（高马尾千金·副机同调随行）">＋张雁</button>
          <button type="button" id="clearCompBtn" class="c-pill clear">清空</button>
        </div>
      </div>
      <input id="compIn" type="text" class="comp-in" placeholder="自动识别已入局角色（如希蓉），也可手填其他引入人物…" />
    </div>

    <div id="protagBox" class="protag-box">
      <div class="comp-top">
        <span class="protag-lbl">🎭 主角自定义姓名与人设（切幕时自动持续继承覆写）</span>
      </div>
      <div class="protag-row">
        <input id="protagNameIn" type="text" class="protag-in" placeholder="自定义姓名（留空则默认）" />
        <input id="protagBioIn" type="text" class="protag-in" placeholder="自定义外貌/身份/关系设定（跨幕自动携带）…" />
      </div>
    </div>

    <div class="d-head">⚡ 本节分段</div>
    <div id="evRow" class="ev-row"></div>

    <div class="d-head">🧭 跨节跳转</div>
    <div class="jump-bar">
      <select id="jumpSel" class="jump-sel"></select>
      <select id="jumpStepSel" class="step-sel"></select>
      <button id="jumpBtn" type="button" class="w-btn primary">填入跳转 ▶</button>
    </div>
    <div id="prevBox" class="prev-card"></div>

    <div class="cfg-bar">
      <div>
        每幕回合：<input id="maxRIn" class="num-box" type="number" min="3" max="30" value="8" />
        <label style="margin-left:8px;cursor:pointer;">
          <input id="hintChk" type="checkbox" checked /> 满回合提醒
        </label>
      </div>
      <div style="display:flex;gap:6px;">
        <button id="saveBtn" type="button" class="w-btn">保存</button>
        <button id="resetBtn" type="button" class="w-btn">重置计数 ↺</button>
      </div>
    </div>
  </div>

  <div id="lbNote" class="lb-note"></div>
</div>

<script>
(function() {
  const RAW = (document.getElementById("rawStatus").value || "").trim();
  const TARGETS = __TARGETS_JSON__;
  const L = String.fromCharCode(60);
  const G = String.fromCharCode(62);
  const OB = String.fromCharCode(91);
  const CB = String.fromCharCode(93);

  function getField(k) {
    const lines = RAW.split(String.fromCharCode(10));
    for (let i = 0; i < lines.length; i++) {
      const idx = lines[i].indexOf(":");
      if (idx < 0) continue;
      if (lines[i].slice(0, idx).trim() === k) return lines[i].slice(idx + 1).trim();
    }
    return "";
  }

  function cleanCompValue(s) {
    const v = String(s || "").trim();
    if (!v) return "";
    if (/^(无|暂无|none|null|尚未引入|无额外角色|无额外同行|仅本幕默认角色)$/i.test(v)) return "";
    return v;
  }

  function cleanProtagValue(s) {
    const v = String(s || "").replace(/[\r\n]+/g, "；").trim();
    if (!v) return "";
    if (/^(默认|无|暂无|none|null|default|未自定义)$/i.test(v)) return "";
    return v;
  }

  const COMPOUND_SURNAMES = [
    "欧阳", "太史", "端木", "上官", "司马", "东方", "独孤", "南宫", "万俟", "闻人",
    "夏侯", "诸葛", "尉迟", "公羊", "赫连", "澹台", "皇甫", "宗政", "濮阳", "公冶",
    "公孙", "慕容", "仲孙", "钟离", "长孙", "宇文", "司徒", "鲜于", "司空", "闾丘",
    "轩辕", "令狐", "百里", "呼延", "东郭", "西门", "第五", "拓跋"
  ];

  function deriveFemAliases(rawName) {
    const nm = cleanProtagValue(rawName);
    if (!nm) return null;
    if (!/^[\u4e00-\u9fa5]{2,6}$/.test(nm)) {
      return { full: nm, surname: nm, cousin: nm, pet: nm };
    }
    let surname = nm.slice(0, 1);
    for (let i = 0; i < COMPOUND_SURNAMES.length; i++) {
      const cs = COMPOUND_SURNAMES[i];
      if (nm.indexOf(cs) === 0 && nm.length > cs.length) {
        surname = cs;
        break;
      }
    }
    const lastCh = nm.charAt(nm.length - 1);
    const pet = nm.charAt(0) === "小" ? nm : ("小" + lastCh);
    const cousin = nm.charAt(0) === "小" ? nm : (surname + "小" + lastCh);
    return { full: nm, surname: surname, cousin: cousin, pet: pet };
  }

  function swapHeroineName(txt, rawName) {
    if (!txt) return "";
    const al = deriveFemAliases(rawName);
    if (!al) return String(txt);
    return String(txt)
      .replace(/伊小芸/g, al.cousin)
      .replace(/伊大教授/g, al.surname + "大教授")
      .replace(/伊大小姐/g, al.surname + "大小姐")
      .replace(/伊教授/g, al.surname + "教授")
      .replace(/伊老师/g, al.surname + "老师")
      .replace(/伊首席/g, al.surname + "首席")
      .replace(/伊小姐/g, al.surname + "小姐")
      .replace(/伊总/g, al.surname + "总")
      .replace(/姓伊的/g, "姓" + al.surname + "的")
      .replace(/伊芸/g, al.full)
      .replace(/小芸/g, al.pet);
  }

  let TOTAL_MAIN_STEPS = 0;
  let TOTAL_EASTER_STEPS = 0;
  for (let i = 0; i < TARGETS.length; i++) {
    const sc = (TARGETS[i].events && TARGETS[i].events.length) ? TARGETS[i].events.length : 3;
    if (TARGETS[i].code.indexOf("X") === 0) {
      TARGETS[i].cum_steps = TOTAL_EASTER_STEPS;
      TOTAL_EASTER_STEPS += sc;
    } else {
      TARGETS[i].cum_steps = TOTAL_MAIN_STEPS;
      TOTAL_MAIN_STEPS += sc;
    }
  }

  function byCode(c) {
    for (let i = 0; i < TARGETS.length; i++) {
      if (TARGETS[i].code === c) return TARGETS[i];
    }
    return null;
  }

  const stageCode = getField("stage") || "N01";
  const curNode = byCode(stageCode) || TARGETS[0];
  const curStepCount = (curNode.events && curNode.events.length) ? curNode.events.length : 3;
  const parsedStep = Number(getField("step"));
  const rawStep = (parsedStep >= 1 && parsedStep <= curStepCount) ? parsedStep : 0;
  const view = getField("view") || "free";
  const role = getField("role") || (view === "male" ? "supreme" : (view === "female" ? "yiyun" : "custom"));
  const rawFemMode = getField("fem_mode");
  const femMode = rawFemMode || (view === "female" ? (role === "custom_fem" ? "custom" : "canon") : "none");
  const npcPolicy = getField("npc_policy") || (view === "male" ? (role === "supreme" ? "male" : "male_flex") : "keep");
  const xcast = getField("xcast") || "solo";
  const canAdvance = getField("can_advance") !== "false";

  const ROLE_LABELS = {
    phd: "普通博士生",
    undergrad: "选修本科生",
    clerk: "拓康基层职员",
    staff: "门店检修员",
    tenant: "街区独居租客",
    custom: "自由路人",
    supreme: "密钥主宰",
    reversal: "下克上",
    protector: "破局共犯",
    insider: "同居近水",
    custom_male: "自拟男主",
    yiyun: "伊芸本尊",
    custom_fem: "自定义女主"
  };

  function getCtx() {
    try {
      const p = window.parent;
      if (p && p.SillyTavern && typeof p.SillyTavern.getContext === "function") {
        return p.SillyTavern.getContext();
      }
    } catch (e) {}
    return null;
  }

  function loadMeta() {
    const ctx = getCtx();
    if (ctx && ctx.chatMetadata) {
      if (!ctx.chatMetadata.lulu_v3) {
        ctx.chatMetadata.lulu_v3 = {
          maxRounds: 8,
          autoHint: true,
          stageCode: curNode.code,
          initStep: rawStep || 1,
          offsetIdx: 0,
          savedCompanions: "",
          companionsCleared: false,
          savedProtagName: "",
          savedProtagBio: ""
        };
      }
      return ctx.chatMetadata.lulu_v3;
    }
    return {
      maxRounds: 8,
      autoHint: true,
      stageCode: curNode.code,
      initStep: rawStep || 1,
      offsetIdx: 0,
      savedCompanions: "",
      companionsCleared: false,
      savedProtagName: "",
      savedProtagBio: ""
    };
  }

  function saveMeta(m) {
    const ctx = getCtx();
    if (ctx && ctx.chatMetadata) {
      ctx.chatMetadata.lulu_v3 = m;
      if (typeof ctx.saveMetadata === "function") ctx.saveMetadata();
    }
  }

  function ctxIsAtGreeting() {
    const ctx = getCtx();
    return Boolean(ctx && Array.isArray(ctx.chat) && ctx.chat.length <= 1);
  }

  const meta = loadMeta();
  if (meta.stageCode !== curNode.code) {
    const ctx = getCtx();
    meta.stageCode = curNode.code;
    meta.initStep = rawStep || 1;
    meta.offsetIdx = ctx && Array.isArray(ctx.chat) ? Math.max(0, ctx.chat.length - 1) : 0;
    saveMeta(meta);
  } else if (rawStep >= 1 && (!meta.initStep || (ctxIsAtGreeting() && meta.initStep !== rawStep))) {
    meta.initStep = rawStep;
    saveMeta(meta);
  }

  let activeProtagName = cleanProtagValue(getField("protag_name")) || cleanProtagValue(meta.savedProtagName);

  function applyView(s) {
    if (!s) return "";
    let out = String(s);
    if (view === "female") {
      if (npcPolicy === "erase") out = scrubEraseLabels(out);
      const curNm = cleanProtagValue(protagNameIn.value) || activeProtagName;

        .replace(/男助教昊鹏/g, "亲临现场的你")
        .replace(/昊鹏与燕芝/g, "你与燕芝")
        .replace(/燕芝和昊鹏/g, "燕芝与你")
        .replace(/昊鹏和燕芝/g, "你与燕芝")
        .replace(/差生李德/g, "你")

    return out;
  }

  const nextStage = getField("next_stage") || curNode.next_code || "";

  function stripMessageBoilerplate(rawMes) {
    let s = String(rawMes || "");
    const divRe = new RegExp(L + 'div style="display:none"' + G + "[\\s\\S]*?【\\/开局阶段触发键】\\s*" + L + "\\/div" + G, "g");
    const cmtRe = new RegExp(L + "!--[\\s\\S]*?【\\/开局阶段触发键】[\\s\\S]*?--" + G, "g");
    const stTag = "LULU_" + "STATUS";
    const stRe = new RegExp("\\" + OB + stTag + "\\" + CB + "[\\s\\S]*?\\" + OB + "\\/" + stTag + "\\" + CB, "g");
    s = s.replace(divRe, "").replace(cmtRe, "").replace(stRe, "");
    return s;
  }

  function mergeCompanionItem(baseStr, itemLabel, keyName) {
    if (!itemLabel) return baseStr;
    if (baseStr && baseStr.indexOf(keyName) >= 0) return baseStr;
    return baseStr ? (baseStr + "；" + itemLabel) : itemLabel;
  }

  function detectActiveCompanions() {
    let merged = cleanCompValue(getField("companions"));
    if (!meta.companionsCleared && meta.savedCompanions) {
      const prevParts = String(meta.savedCompanions).split(/[；;]+/);
      for (let p = 0; p < prevParts.length; p++) {
        const seg = prevParts[p].trim();
        if (!seg) continue;
        const head = seg.split(/[（(]/)[0].trim();
        if (head && merged.indexOf(head) < 0) {
          merged = merged ? (merged + "；" + seg) : seg;
        }
      }
    }
    if (curNode.code.indexOf("X") === 0 && merged.indexOf("希蓉") < 0 && !meta.companionsCleared) {
      merged = mergeCompanionItem(merged, "希蓉（阿斯兰蒂公使·二号副耳钉同场随行）", "希蓉");
    }
    const ctx = getCtx();
    if (!meta.companionsCleared && ctx && Array.isArray(ctx.chat)) {
      let visibleBag = "";
      for (let i = 0; i < ctx.chat.length; i++) {
        if (ctx.chat[i] && ctx.chat[i].mes) {
          visibleBag += "\n" + stripMessageBoilerplate(ctx.chat[i].mes);
        }
      }
      if (visibleBag.indexOf("希蓉") >= 0) {
        merged = mergeCompanionItem(merged, "希蓉（阿斯兰蒂公使·二号副耳钉同场随行）", "希蓉");
      }
      if (xcast === "full") {
        if (visibleBag.indexOf("琪琪") >= 0) {
          merged = mergeCompanionItem(merged, "琪琪（旗袍女歌星·彩蛋随行）", "琪琪");
        }
        if (visibleBag.indexOf("程欣然") >= 0 || visibleBag.indexOf("程孜然") >= 0) {
          merged = mergeCompanionItem(merged, "程欣然与程孜然（礼仪电子社姐妹·子母副端随行）", "程");
        }
      }
    }
    if (merged && merged !== meta.savedCompanions && !meta.companionsCleared) {
      meta.savedCompanions = merged;
      saveMeta(meta);
    }
    return merged;
  }

  function summarizeCompNames(compStr) {
    const clean = cleanCompValue(compStr);
    if (!clean) return "";
    const parts = clean.split(/[；;|、,，]+/);
    const names = [];
    for (let i = 0; i < parts.length; i++) {
      const head = parts[i].split(/[（(:：]/)[0].trim();
      if (head && names.indexOf(head) < 0) names.push(head);
    }
    return names.join(" · ");
  }

  function countRounds() {
    const ctx = getCtx();
    if (!ctx || !Array.isArray(ctx.chat)) return 1;
    const tag = OB + OB + "LULU_STAGE:" + curNode.code + CB + CB;
    let start = meta.offsetIdx || 0;
    for (let i = ctx.chat.length - 1; i >= 0; i--) {
      const mes = String((ctx.chat[i] && ctx.chat[i].mes) || "");
      if (mes.indexOf("【阶段推进确认】") >= 0 && mes.indexOf(tag) >= 0) {
        start = Math.max(start, i);
        break;
      }
    }
    let userTurns = 0;
    for (let j = start; j < ctx.chat.length; j++) {
      if (ctx.chat[j] && ctx.chat[j].is_user) userTurns += 1;
    }
    return Math.max(1, userTurns);
  }

  const rounds = countRounds();
  const maxR = Math.max(3, Number(meta.maxRounds) || 8);
  const baseStep = Math.max(1, Math.min(curStepCount, Number(meta.initStep) || rawStep || 1));
  const stepSpan = Math.max(1, Math.ceil(maxR / curStepCount));
  const autoPhase = Math.min(curStepCount, baseStep + Math.floor((rounds - 1) / stepSpan));
  const phase = rawStep ? Math.max(rawStep, autoPhase) : autoPhase;

      paceRuleIdx + "严格保持当前模式的人称视角与玩家在场身份定位，承接前文既成人物关系与调教进展细腻推演，切勿单轮速通。\n" +
      statusRuleIdx + "回复正文结束后，在整条消息最末尾按规范输出更新后的状态栏（stage: " + t.code +
      "，step: " + st +
      "，stage_title: " + tTitle +
      "，location: " + tLoc +
      "，companions: " + compStatusSpec +
      "，fem_mode: " + femMode +
      "，protag_name: " + pNameOut +
      "，protag_bio: " + pBioOut +
      "，next_stage: " + (t.next_code || "") +
      "，next_title: " + nTitle +
      "，advance_id: " + (t.next_code ? t.code + "_TO_" + t.next_code : "") +
      "，can_advance: " + (t.next_code ? "true" : "false") +
      "，其余 view / role / npc_policy / xcast 键值保持不变）。"
    );
  }

  function fillChatInput(text, label) {
    const note = document.getElementById("lbNote");
    try {
      const doc = window.parent && window.parent.document;
      const el = doc && (doc.querySelector("#send_textarea") || doc.querySelector("textarea#send_textarea") || doc.querySelector("textarea"));
      if (el) {
        const proto = (window.parent && window.parent.HTMLTextAreaElement && window.parent.HTMLTextAreaElement.prototype)
          || (window.HTMLTextAreaElement && window.HTMLTextAreaElement.prototype);
        const desc = proto ? Object.getOwnPropertyDescriptor(proto, "value") : null;
        if (desc && typeof desc.set === "function") desc.set.call(el, text);
        else el.value = text;
        el.dispatchEvent(new Event("input", { bubbles: true }));
        el.dispatchEvent(new Event("change", { bubbles: true }));
        el.focus();
        const activeComp = summarizeCompNames(compIn.value);
        const compTip = activeComp ? ("（已自动携带同行：" + activeComp + "）") : "";
        note.textContent = "✓ 已将「" + label + "」推进指令填入聊天框" + compTip + "，发送即可进入该段剧情。";
        return;
      }
      navigator.clipboard.writeText(text);
      note.textContent = "已复制「" + label + "」推进指令至剪贴板。";
    } catch (e) {
      note.textContent = "提示：" + String(e);
    }
  }

  const evRow = document.getElementById("evRow");
  function renderEventButtons() {
    evRow.innerHTML = "";
    (curMeta.events || curNode.events || []).forEach(function(ev, i) {
      const stIdx = i + 1;
      const d = document.createElement("button");
      d.type = "button";
      d.className = "ev-item" + (stIdx === phase ? " active" : "");
      const t = document.createElement("div");
      t.className = "ev-tag";
      t.textContent = curNode.code + "." + stIdx + (stIdx === phase ? " · 当前" : "");
      const b = document.createElement("div");
      b.textContent = applyView(ev);
      d.appendChild(t);
      d.appendChild(b);
      d.addEventListener("click", function() {
        fillChatInput(makeAdvancePrompt(curNode, stIdx), curNode.code + "." + stIdx + " · " + applyView(ev));
      });
      evRow.appendChild(d);
    });
  }
  renderEventButtons();

  const sel = document.getElementById("jumpSel");
  const stepSel = document.getElementById("jumpStepSel");
  function populateJumpSelect() {
    const prevVal = sel.value;
    sel.innerHTML = "";
    const groups = {};
    TARGETS.forEach(function(t) {
      const tm = getTargetMeta(t);
      const gLabel = applyView(t.arc_name);
      if (!groups[gLabel]) {
        const og = document.createElement("optgroup");
        og.label = gLabel;
        groups[gLabel] = og;
        sel.appendChild(og);
      }
      const opt = document.createElement("option");
      opt.value = t.code;
      opt.textContent = t.code + " · " + applyView(tm.short_title) + " (" + (tm.location || t.location) + ")";
      groups[gLabel].appendChild(opt);
    });
    sel.value = prevVal || (nxtObj ? nxtObj.code : curNode.code);
  }
  populateJumpSelect();

  function syncStepOptions() {
    const t = byCode(sel.value) || curNode;
    const tm = getTargetMeta(t);
    const evs = tm.events || t.events || [];
    const tMax = evs.length || 3;
    const prevVal = Number(stepSel.value) || 1;
    stepSel.innerHTML = "";
    for (let s = 1; s <= tMax; s++) {
      const o = document.createElement("option");
      o.value = String(s);
      o.textContent = "第 " + s + " 段 (." + s + ")";
      stepSel.appendChild(o);
    }
    stepSel.value = String(prevVal <= tMax ? prevVal : 1);
  }

  function refreshPreview() {
    const t = byCode(sel.value) || curNode;
    const tm = getTargetMeta(t);
    const evs = tm.events || t.events || [];
    const tMax = evs.length || 3;
    const st = Math.max(1, Math.min(tMax, Number(stepSel.value) || 1));
    const chosenEv = evs[st - 1] ? applyView(evs[st - 1]) : "";
    const targetComp = resolveTargetCompanions(t);
    const compLine = targetComp ? (" ｜ ✦ 随行同场：" + summarizeCompNames(targetComp)) : "";
    document.getElementById("prevBox").textContent =
      "【目标子段 · " + t.code + "." + st + " " + applyView(tm.short_title) + "】地点：" + (tm.location || t.location) +
      " ｜ 硬件：" + applyView(tm.attire_state) + compLine + " ｜ 切入事件：" + chosenEv;
  }

  sel.addEventListener("change", function() {
    syncStepOptions();
    refreshPreview();
  });
  stepSel.addEventListener("change", refreshPreview);

  function onProtagInput() {
    activeProtagName = cleanProtagValue(protagNameIn.value);
    activeProtagBio = cleanProtagValue(protagBioIn.value);
    meta.savedProtagName = activeProtagName;
    meta.savedProtagBio = activeProtagBio;
    saveMeta(meta);
    renderViewBadge();
    renderEventButtons();
    populateJumpSelect();
    refreshPreview();
  }
  protagNameIn.addEventListener("input", onProtagInput);
  protagBioIn.addEventListener("input", onProtagInput);

  compIn.addEventListener("input", function() {
    const v = cleanCompValue(compIn.value);
    meta.savedCompanions = v;
    meta.companionsCleared = (v === "");
    saveMeta(meta);
    syncCompanionDisplay();
    refreshPreview();
  });

  document.querySelectorAll(".c-pill[data-add]").forEach(function(btn) {
    btn.addEventListener("click", function() {
      const addItem = btn.getAttribute("data-add") || "";
      const head = addItem.split(/[（(]/)[0].trim();
      const cur = cleanCompValue(compIn.value);
      compIn.value = mergeCompanionItem(cur, addItem, head);
      meta.savedCompanions = compIn.value;
      meta.companionsCleared = false;
      saveMeta(meta);
      syncCompanionDisplay();
      refreshPreview();
    });
  });

  document.getElementById("clearCompBtn").addEventListener("click", function() {
    compIn.value = "";
    meta.savedCompanions = "";
    meta.companionsCleared = true;
    saveMeta(meta);
    syncCompanionDisplay();
    refreshPreview();
  });

  syncStepOptions();
  refreshPreview();

  document.getElementById("maxRIn").value = String(maxR);
  document.getElementById("hintChk").checked = Boolean(meta.autoHint);

  const drawer = document.getElementById("drawerBox");
  document.getElementById("drawerBtn").addEventListener("click", function() {
    drawer.classList.toggle("open");
  });

  const nextBtn = document.getElementById("nextBtn");
  if (!nxtObj || !canAdvance) nextBtn.disabled = true;

  nextBtn.addEventListener("click", function() {
    if (nxtObj) fillChatInput(makeAdvancePrompt(nxtObj, 1), nxtObj.code + ".1 · " + applyView(nxtMeta.short_title));
  });

  document.getElementById("jumpBtn").addEventListener("click", function() {
    const t = byCode(sel.value);
    const tm = getTargetMeta(t);
    const evs = (tm && tm.events) || (t && t.events) || [];
    const tMax = evs.length || 3;
    const st = Math.max(1, Math.min(tMax, Number(stepSel.value) || 1));
    if (t) fillChatInput(makeAdvancePrompt(t, st), t.code + "." + st + " · " + applyView(tm.short_title));
  });

  document.getElementById("saveBtn").addEventListener("click", function() {
    const v = Math.max(3, Math.min(30, Number(document.getElementById("maxRIn").value) || 8));
    const c = Boolean(document.getElementById("hintChk").checked);
    meta.maxRounds = v;
    meta.autoHint = c;
    saveMeta(meta);
    document.getElementById("lbNote").textContent = "✓ 已保存：每幕建议 " + v + " 回合。";
  });

  document.getElementById("resetBtn").addEventListener("click", function() {
    const ctx = getCtx();
    if (ctx && Array.isArray(ctx.chat)) {
      meta.offsetIdx = Math.max(0, ctx.chat.length - 1);
      meta.initStep = 1;
      saveMeta(meta);
      document.getElementById("bRound").textContent = "本幕 1 / " + meta.maxRounds + " 回合 · 阶段 1/" + curStepCount;
      document.getElementById("lbNote").textContent = "✓ 已重置本幕回合计数。";
    }
  });
})();
</script>
</body>
</html>
