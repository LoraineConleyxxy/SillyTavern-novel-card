<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
:root {
  --bg-root: #14110e;
  --bg-card: #1d1915;
  --bg-elevated: #25201a;
  --border: #3a3126;
  --border-subtle: #2b241c;
  --gold: #c9a84c;
  --gold-light: #e6d39e;
  --gold-dim: #8a7132;
  --text-main: #ebe1d1;
  --text-sub: #b5a792;
  --text-muted: #7d7161;
  --serif: 'Noto Serif SC', 'Source Han Serif SC', 'Songti SC', serif;
  --sans: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: transparent;
  color: var(--text-main);
  font-family: var(--sans);
  line-height: 1.5;
}
.eil-bar {
  max-width: 820px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: linear-gradient(160deg, #1b1713 0%, #14110e 100%);
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.38);
  overflow: hidden;
}
.eil-strip {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px 12px;
  padding: 9px 14px;
  background: linear-gradient(90deg, rgba(201, 168, 76, 0.08), transparent 65%);
}
.eil-left {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  min-width: 0;
}
.eil-node-badge {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 700;
  color: var(--gold-light);
  letter-spacing: 0.5px;
}
.eil-chip {
  font-size: 11px;
  color: var(--text-sub);
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 1px 7px;
  white-space: nowrap;
}
.eil-chip.gold {
  color: var(--gold-light);
  border-color: var(--gold-dim);
  background: rgba(201, 168, 76, 0.09);
}
.eil-right {
  display: flex;
  align-items: center;
  gap: 6px;
  margin-left: auto;
}
.eil-btn {
  padding: 5px 11px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-main);
  font-size: 11.5px;
  cursor: pointer;
  transition: all 0.18s;
  font-family: inherit;
  white-space: nowrap;
}
.eil-btn:hover:not(:disabled) {
  border-color: var(--gold);
  color: var(--gold-light);
  background: var(--bg-elevated);
}
.eil-btn.primary {
  border-color: var(--gold-dim);
  background: rgba(201, 168, 76, 0.14);
  color: var(--gold-light);
  font-weight: 600;
}
.eil-btn.primary:hover:not(:disabled) {
  border-color: var(--gold);
  background: rgba(201, 168, 76, 0.24);
}
.eil-btn:disabled {
  opacity: 0.4;
  cursor: default;
}

/* Plot Control Drawer (Zhetian Volume 6 Style) */
.eil-drawer {
  display: none;
  border-top: 1px solid var(--border-subtle);
  padding: 12px 14px;
  background: rgba(16, 13, 10, 0.85);
}
.eil-bar.is-open .eil-drawer {
  display: block;
}
.drawer-grid {
  display: grid;
  grid-template-columns: 1.05fr 1fr;
  gap: 14px;
}
.d-sec-title {
  font-size: 10.5px;
  color: var(--gold);
  letter-spacing: 1.5px;
  font-weight: 600;
  margin-bottom: 5px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.event-list {
  padding-left: 17px;
  font-size: 11.5px;
  color: var(--text-sub);
  line-height: 1.65;
  background: var(--bg-card);
  border: 1px solid var(--border-subtle);
  border-radius: 6px;
  padding: 8px 10px 8px 24px;
}
.event-list li {
  margin-bottom: 4px;
}
.event-list li.is-cur {
  color: var(--gold-light);
  font-weight: 600;
}
.ctrl-box {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.field-label {
  font-size: 11px;
  color: var(--text-sub);
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.eil-select, .eil-input {
  width: 100%;
  padding: 6px 9px;
  border-radius: 5px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-main);
  font-size: 12px;
  font-family: inherit;
}
.eil-select:focus, .eil-input:focus {
  outline: none;
  border-color: var(--gold);
}
.ctrl-row {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}
.ctrl-row .field-inline {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--text-sub);
}
.ctrl-row .eil-input {
  width: 68px;
  text-align: center;
}
.target-preview {
  font-size: 11px;
  color: var(--text-muted);
  line-height: 1.5;
  background: var(--bg-card);
  border: 1px dashed var(--border-subtle);
  border-radius: 5px;
  padding: 6px 8px;
}
.ctrl-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 2px;
}
.eil-note {
  margin-top: 8px;
  font-size: 11px;
  color: var(--gold-light);
  min-height: 15px;
}
@media (max-width: 620px) {
  .drawer-grid { grid-template-columns: 1fr; }
  .eil-right { width: 100%; justify-content: flex-end; }
}
</style>
</head>
<body>
<div class="eil-bar" id="eilBar">
  <textarea id="rawStatus" style="display:none">$1</textarea>
  <div class="eil-strip">
    <div class="eil-left">
      <span class="eil-node-badge" id="curNode">R1 · 便器总督的就职仪式</span>
      <span class="eil-chip" id="curLoc">魔界·黑水城</span>
      <span class="eil-chip" id="curMode">自由探索</span>
      <span class="eil-chip gold" id="curPace">本段 0 / 8 回合 · 阶段 1/3</span>
    </div>
    <div class="eil-right">
      <button type="button" class="eil-btn" id="toggleDrawerBtn">卷六 · 剧情控制 ▾</button>
      <button type="button" class="eil-btn primary" id="quickNextBtn">推进下一章 ▶</button>
    </div>
  </div>

  <div class="eil-drawer" id="plotDrawer">
    <div class="drawer-grid">
      <div>
        <div class="d-sec-title">
          <span>本节事件脉络（按序展开）</span>
          <span id="paceLabel" style="color:var(--text-muted);font-weight:normal;">当前节奏：第 1 幕</span>
        </div>
        <ol class="event-list" id="eventList"></ol>
      </div>

      <div class="ctrl-box">
        <div class="d-sec-title"><span>后续节点调度</span></div>
        <label class="field-label">
          <span>接下来发展到：</span>
          <select class="eil-select" id="targetSelect"></select>
        </label>
        <div class="target-preview" id="targetPreview"></div>
        <div class="ctrl-row">
          <label class="field-inline">
            <span>每段回合数</span>
            <input type="number" class="eil-input" id="limitInput" min="1" max="50" step="1" value="8">
          </label>
          <label class="field-inline" style="cursor:pointer;">
            <input type="checkbox" id="autoCheck" checked>
            <span>满回合自动提示推进</span>
          </label>
        </div>
        <div class="ctrl-actions">
          <button type="button" class="eil-btn primary" id="advanceBtn">注入选中剧情 ▶</button>
          <button type="button" class="eil-btn" id="saveCfgBtn">保存设置</button>
          <button type="button" class="eil-btn" id="restartBtn">本段重新计数 ↺</button>
        </div>
      </div>
    </div>
    <div class="eil-note" id="statusNote">提示：点击「注入选中剧情 ▶」或顶栏「推进下一章 ▶」可将自然衔接过渡指令填入输入框。</div>
  </div>
</div>

<script>
(function() {
  const RAW = (document.getElementById("rawStatus") && document.getElementById("rawStatus").value) || "";
  const CARD_NS = "EILATIA";
  const TARGETS = __TARGETS_JSON__;
  const META_KEY = "eilatia_plot_control_v3";

  function statusTag(close) {
    const L = String.fromCharCode(91), R = String.fromCharCode(93);
    return L + (close ? "/" : "") + CARD_NS + "_STATUS" + R;
  }
  function field(name) {
    const lines = RAW.split(String.fromCharCode(10));
    for (const line of lines) {
      const idx = line.indexOf(":");
      if (idx < 0) continue;
      if (line.slice(0, idx).trim() === name) return line.slice(idx + 1).trim();
    }
    return "";
  }
  function byCode(code) {
    return TARGETS.find(function(t) { return t.code === code; }) || null;
  }
  function key(kind, val) {
    return "[[" + CARD_NS + "_" + kind + ":" + val + "]]";
  }

  // Zhetian-inspired round counter & metadata manager
  function getHostCtx() {
    try {
      const host = window.parent && window.parent.SillyTavern;
      if (host && typeof host.getContext === "function") return host.getContext();
    } catch (_) {}
    return null;
  }
  function countUserRoundsSinceStage(chat, stageCode) {
    if (!Array.isArray(chat)) return 0;
    let startIdx = 0;
    const marker = "STAGE:" + stageCode + "]]";
    for (let i = 0; i < chat.length; i++) {
      const m = chat[i];
      if (!m) continue;
      const txt = String(m.mes || "");
      if (txt.indexOf(marker) >= 0) {
        startIdx = i;
        break;
      }
    }
    let rounds = 0;
    let pendingUser = false;
    for (let i = startIdx; i < chat.length; i++) {
      const m = chat[i];
      if (!m || m.is_system) continue;
      if (m.is_user) pendingUser = true;
      else if (pendingUser && String(m.mes || "").trim()) {
        rounds++;
        pendingUser = false;
      }
    }
    return rounds;
  }

  const stage = field("stage") || "R1";
  const curTarget = byCode(stage) || TARGETS[0];
  const stageTitle = field("stage_title") || (curTarget ? curTarget.title : "");
  const viewMode = field("view") || "free";
  const npcMode = field("npc_mode") || (viewMode === "male" ? "replaced" : "keep");
  const rawNext = field("next_stage");
  const nextStage = rawNext !== "" ? rawNext : (curTarget ? curTarget.next_code : "");
  const nextTarget = byCode(nextStage);
  const canAdvance = field("can_advance") !== "false" && Boolean(nextStage && nextTarget);

  const ctx = getHostCtx();
  const metaRec = (ctx && ctx.chatMetadata && ctx.chatMetadata[META_KEY]) || {};
  const limitVal = Math.max(1, Math.min(50, Number(metaRec.limit) || 8));
  const autoVal = metaRec.auto !== undefined ? Boolean(metaRec.auto) : true;
  const resetAnchor = (metaRec.resetNode === stage && Number.isInteger(metaRec.resetAt)) ? metaRec.resetAt : 0;
  const rawRounds = ctx ? countUserRoundsSinceStage(ctx.chat, stage) : 0;
  const elapsed = Math.max(0, rawRounds - resetAnchor);

  const evs = (curTarget && Array.isArray(curTarget.events)) ? curTarget.events : [];
  const evCount = Math.max(1, evs.length);
  const curStepIdx = Math.min(evCount - 1, Math.floor((elapsed * evCount) / limitVal));

  // Populate top strip
  let vpLabel = "自由探索";
  if (viewMode === "free" || viewMode === "original") {
    vpLabel = npcMode === "erase" ? "自由探索·清退反派" : "自由探索·可截胡NPC";
  } else if (viewMode === "male") {
    vpLabel = "男主视角";
  } else if (viewMode === "female") {
    vpLabel = "女主视角";
  }

  document.getElementById("curNode").textContent = stage + (stageTitle ? " · " + stageTitle : "");
  document.getElementById("curLoc").textContent = curTarget ? curTarget.location : "当前场景";
  document.getElementById("curMode").textContent = vpLabel;
  const dueHint = (autoVal && elapsed >= limitVal && canAdvance) ? "（可推进下一章）" : "";
  document.getElementById("curPace").textContent = "本段 " + elapsed + " / " + limitVal + " 回合 · 阶段 " + (curStepIdx + 1) + "/" + evCount + dueHint;
  document.getElementById("paceLabel").textContent = "当前节奏：第 " + (curStepIdx + 1) + " / " + evCount + " 阶段";

  // Populate 3-step events list
  const evListEl = document.getElementById("eventList");
  evListEl.innerHTML = "";
  evs.forEach(function(evText, idx) {
    const li = document.createElement("li");
    if (idx === curStepIdx) li.className = "is-cur";
    li.textContent = evText;
    evListEl.appendChild(li);
  });

  // Populate target selector
  const select = document.getElementById("targetSelect");
  const groups = {};
  TARGETS.forEach(function(t) {
    if (!groups[t.arc_name]) {
      const og = document.createElement("optgroup");
      og.label = t.arc_name;
      groups[t.arc_name] = og;
      select.appendChild(og);
    }
    const o = document.createElement("option");
    o.value = t.code;
    o.textContent = t.code + " · " + t.title + " (" + t.location + ")";
    groups[t.arc_name].appendChild(o);
  });

  const savedTarget = metaRec.target && byCode(metaRec.target) ? metaRec.target : "";
  if (savedTarget && savedTarget !== stage) select.value = savedTarget;
  else if (nextStage && byCode(nextStage)) select.value = nextStage;
  else if (curTarget) select.value = curTarget.code;

  document.getElementById("limitInput").value = String(limitVal);
  document.getElementById("autoCheck").checked = autoVal;

  function updateTargetPreview() {
    const t = byCode(select.value);
    const pv = document.getElementById("targetPreview");
    if (!t || !pv) return;
    const firstEv = (Array.isArray(t.events) && t.events[0]) ? t.events[0] : "";
    pv.textContent = "【" + t.code + " · " + t.title + "】地点：" + t.location + (firstEv ? " ｜ 开场：" + firstEv : "");
  }
  select.addEventListener("change", updateTargetPreview);
  updateTargetPreview();

  const quickNextBtn = document.getElementById("quickNextBtn");
  const advanceBtn = document.getElementById("advanceBtn");
  const noteEl = document.getElementById("statusNote");
  if (!canAdvance) quickNextBtn.disabled = true;

  // Toggle drawer
  const barEl = document.getElementById("eilBar");
  const toggleBtn = document.getElementById("toggleDrawerBtn");
  toggleBtn.addEventListener("click", function() {
    const open = barEl.classList.toggle("is-open");
    toggleBtn.textContent = open ? "收起控制 ▴" : "卷六 · 剧情控制 ▾";
  });

  function promptForTarget(t) {
    const from = stage || "当前阶段";
    const fromTitle = stageTitle || "";
    const firstEv = (Array.isArray(t.events) && t.events[0]) ? t.events[0] : t.title;
    const open = statusTag(false), close = statusTag(true);
    return "【阶段推进确认】\n" +
      "from: " + from + (fromTitle ? " · " + fromTitle : "") + "\n" +
      "to: " + t.code + " · " + t.title + "\n" +
      "advance_key: " + key("ADVANCE", from + "_TO_" + t.code) + "\n" +
      "stage_key: " + t.stage_key + "\n" +
      "opening_key: " + t.opening_key + "\n" +
      "view: " + viewMode + "\n" +
      "npc_mode: " + npcMode + "\n" +
      "view_key: " + key("VIEW", viewMode) + "\n" +
      "npc_key: " + key("NPC", npcMode) + "\n\n" +
      "【后续剧情注入与衔接指引】\n" +
      "请从本轮回复起，将故事从「" + from + " · " + fromTitle + "」自然衔接推进至「" + t.code + " · " + t.title + "」（地点：" + t.location + "）。\n" +
      "1. 承接本局已经发生的人物关系、身体状态与互动结果，先收束眼前余波，再自然切入新节点的开场事件：" + firstEv + "\n" +
      "2. 按新节点的近期事件序列（1 → 2 → 3）逐步展开，勿单轮速通。\n" +
      "3. 回复末尾请同步更新输出以下状态块：\n" +
      open + "\n" +
      "stage: " + t.code + "\n" +
      "stage_title: " + t.title + "\n" +
      "stage_key: " + t.stage_key + "\n" +
      "opening_key: " + t.opening_key + "\n" +
      "view: " + viewMode + "\n" +
      "npc_mode: " + npcMode + "\n" +
      "next_stage: " + t.next_code + "\n" +
      "next_title: " + t.next_title + "\n" +
      "advance_id: " + (t.next_code ? t.code + "_TO_" + t.next_code : "") + "\n" +
      "can_advance: " + (t.next_code ? "true" : "false") + "\n" +
      close;
  }

  function putIntoInput(text, label) {
    let ok = false;
    try {
      const doc = window.parent && window.parent.document;
      const el = doc && (doc.querySelector("#send_textarea") || doc.querySelector("textarea#send_textarea") || doc.querySelector("textarea"));
      if (el) {
        el.value = text;
        el.dispatchEvent(new Event("input", {bubbles: true}));
        el.dispatchEvent(new Event("change", {bubbles: true}));
        el.focus();
        ok = true;
      }
    } catch (e) { console.error(e); }
    if (ok) {
      noteEl.textContent = "已将【" + label + "】衔接推进指令填入酒馆输入框，直接发送即可进入下一剧情。";
      return;
    }
    try {
      navigator.clipboard.writeText(text);
      noteEl.textContent = "已复制【" + label + "】推进指令到剪贴板，请粘贴发送。";
    } catch (e) {
      noteEl.textContent = "请手动复制推进指令。";
    }
  }

  async function savePlotMeta(extra) {
    const c = getHostCtx();
    const lim = Math.max(1, Math.min(50, Math.round(Number(document.getElementById("limitInput").value) || 8)));
    const aut = document.getElementById("autoCheck").checked;
    const tgt = select.value;
    if (c && c.chatMetadata) {
      const prev = c.chatMetadata[META_KEY] || {};
      c.chatMetadata[META_KEY] = Object.assign({}, prev, {
        limit: lim,
        auto: aut,
        target: tgt
      }, extra || {});
      if (typeof c.saveMetadata === "function") {
        try { await c.saveMetadata(); } catch (_) {}
      }
    }
  }

  quickNextBtn.addEventListener("click", function() {
    const t = byCode(nextStage);
    if (!t) return;
    select.value = t.code;
    updateTargetPreview();
    savePlotMeta({target: t.code});
    putIntoInput(promptForTarget(t), t.code + " · " + t.title);
  });

  advanceBtn.addEventListener("click", function() {
    const t = byCode(select.value);
    if (!t) return;
    savePlotMeta({target: t.code});
    putIntoInput(promptForTarget(t), t.code + " · " + t.title);
  });

  document.getElementById("saveCfgBtn").addEventListener("click", async function() {
    await savePlotMeta({});
    noteEl.textContent = "已保存本局剧情控制设置（每段 " + document.getElementById("limitInput").value + " 回合，目标：" + select.value + "）。";
  });

  document.getElementById("restartBtn").addEventListener("click", async function() {
    await savePlotMeta({resetNode: stage, resetAt: rawRounds});
    document.getElementById("curPace").textContent = "本段 0 / " + document.getElementById("limitInput").value + " 回合 · 阶段 1/" + evCount;
    noteEl.textContent = "已将当前节点（" + stage + "）回合计数归零，可继续深入探索当前场景。";
  });
})();
</script>
</body>
</html>
