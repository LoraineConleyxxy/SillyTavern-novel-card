<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg-deep: #091118;
    --bg-panel: #0f1c28;
    --bg-card: #132333;
    --bg-elev: #172b3e;
    --mint-main: #00e5c3;
    --mint-dim: rgba(0, 229, 195, 0.13);
    --sky-main: #38bdf8;
    --sky-dim: rgba(56, 189, 248, 0.14);
    --coral-warn: #fb7185;
    --amber-acc: #fbbf24;
    --txt-hi: #eaf6fb;
    --txt-sec: #9dc0d4;
    --txt-mut: #628398;
    --line-soft: rgba(56, 189, 248, 0.18);
    --line-strong: rgba(0, 229, 195, 0.42);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--txt-hi);
    line-height: 1.5;
  }
  .lulu-os {
    background: radial-gradient(circle at 88% 8%, rgba(0, 229, 195, 0.1), transparent 40%),
                linear-gradient(165deg, #091118 0%, #0d1924 55%, #0b1520 100%);
    border: 1.5px solid var(--line-strong);
    border-radius: 16px;
    box-shadow: 0 14px 36px rgba(3, 9, 15, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
    overflow: hidden;
  }

  /* 1. Compact Header */
  .os-header {
    padding: 11px 16px;
    background: linear-gradient(90deg, #0b1824 0%, #112638 60%, #0e2230 100%);
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .os-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .os-kicker {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 800;
    letter-spacing: 0.9px;
    color: var(--mint-main);
    background: rgba(0, 229, 195, 0.1);
    border: 1px solid rgba(0, 229, 195, 0.32);
    padding: 2px 8px;
    border-radius: 999px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .pulse-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--mint-main);
    box-shadow: 0 0 7px var(--mint-main);
    display: inline-block;
  }
  .os-title {
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: #ffffff;
  }
  .telemetry-badges {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .t-chip {
    font-size: 11px;
    font-weight: 600;
    padding: 2px 9px;
    border-radius: 999px;
    background: rgba(56, 189, 248, 0.09);
    border: 1px solid rgba(56, 189, 248, 0.24);
    color: #bae6fd;
  }
  .t-chip.online {
    background: rgba(0, 229, 195, 0.13);
    border-color: rgba(0, 229, 195, 0.4);
    color: #99f6e4;
  }

  /* 2. Clean Mode Strip & Sub-toolbar */
  .mode-zone {
    padding: 10px 16px;
    background: rgba(15, 28, 40, 0.85);
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .mode-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .m-card {
    text-align: left;
    background: var(--bg-card);
    border: 1.5px solid var(--line-soft);
    border-radius: 10px;
    padding: 8px 11px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    font-family: inherit;
    color: var(--txt-hi);
  }
  .m-card:hover {
    border-color: var(--sky-main);
    transform: translateY(-1px);
  }
  .m-card.active {
    border-color: var(--mint-main);
    background: linear-gradient(145deg, #13283a 0%, #102431 100%);
    box-shadow: 0 4px 14px rgba(0, 229, 195, 0.15);
  }
  .m-head {
    font-size: 12.5px;
    font-weight: 800;
    color: #ffffff;
    margin-bottom: 2px;
  }
  .m-card.active .m-head {
    color: var(--mint-main);
  }
  .m-desc {
    font-size: 11px;
    color: var(--txt-sec);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sub-bar {
    padding: 8px 10px;
    background: rgba(9, 17, 24, 0.72);
    border: 1px solid rgba(56, 189, 248, 0.22);
    border-radius: 9px;
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .sub-bar.stack {
    flex-direction: column;
    align-items: stretch;
  }
  .sub-bar.hidden { display: none; }
  .sub-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .sub-group {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 5px;
  }
  .sub-lbl {
    font-size: 11px;
    font-weight: 700;
    color: var(--txt-mut);
    margin-right: 2px;
  }
  .r-pill, .n-btn, .q-pill {
    padding: 4px 9px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    background: var(--bg-card);
    color: var(--txt-sec);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.14s ease;
    white-space: nowrap;
  }
  .r-pill:hover, .n-btn:hover, .q-pill:hover {
    border-color: var(--sky-main);
    color: #ffffff;
  }
  .r-pill.active {
    border-color: var(--mint-main);
    background: rgba(0, 229, 195, 0.15);
    color: #ffffff;
    font-weight: 700;
    box-shadow: inset 0 0 0 1px rgba(0, 229, 195, 0.22);
  }
  .n-btn.active {
    background: var(--mint-main);
    border-color: var(--mint-main);
    color: #051816;
    font-weight: 800;
  }
  .route-hint {
    font-size: 11px;
    color: #bde6f4;
    background: rgba(0, 229, 195, 0.07);
    border-left: 2.5px solid var(--mint-main);
    padding: 4px 8px;
    border-radius: 5px;
  }
  .custom-box {
    background: rgba(6, 13, 20, 0.78);
    border: 1px dashed rgba(0, 229, 195, 0.34);
    border-radius: 8px;
    padding: 7px 9px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .custom-box.hidden { display: none; }
  .c-inputs {
    display: grid;
    grid-template-columns: 165px 1fr;
    gap: 6px;
  }
  .c-in {
    width: 100%;
    padding: 5px 9px;
    border-radius: 7px;
    border: 1px solid rgba(56, 189, 248, 0.28);
    background: #071018;
    color: var(--txt-hi);
    font-size: 11.5px;
    font-family: inherit;
    outline: none;
  }
  .c-in:focus {
    border-color: var(--mint-main);
  }
  .c-in::placeholder {
    color: var(--txt-mut);
  }
  .q-pill {
    font-size: 10.5px;
    padding: 2px 8px;
    border-color: rgba(0, 229, 195, 0.28);
    color: #99f6e4;
  }
  .q-pill.clear {
    border-color: rgba(157, 192, 212, 0.25);
    color: var(--txt-mut);
  }

  /* 3. Single-Row Stage Filter & Search */
  .stage-bar {
    padding: 8px 16px;
    background: var(--bg-panel);
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .arc-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }
  .a-pill {
    padding: 4px 10px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    background: var(--bg-card);
    color: var(--txt-sec);
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.14s;
  }
  .a-pill:hover { border-color: var(--sky-main); color: #ffffff; }
  .a-pill.active {
    background: linear-gradient(135deg, var(--mint-main), var(--sky-main));
    border-color: transparent;
    color: #05161c;
    font-weight: 800;
  }
  .a-pill.easter {
    border-color: rgba(251, 191, 36, 0.45);
    color: #fde68a;
  }
  .a-pill.easter.active {
    background: linear-gradient(135deg, #fbbf24, var(--mint-main));
    border-color: transparent;
    color: #05161c;
    font-weight: 800;
  }
  .stage-search {
    width: 185px;
    max-width: 100%;
    padding: 4px 11px;
    border-radius: 999px;
    border: 1px solid var(--line-strong);
    background: var(--bg-deep);
    font-size: 11.5px;
    color: var(--txt-hi);
    outline: none;
  }
  .stage-search::placeholder { color: var(--txt-mut); }

  /* 4. Dual-Pane Console */
  .os-bench {
    display: grid;
    grid-template-columns: 236px 1fr;
    background: var(--bg-deep);
    align-items: stretch;
  }
  .node-col {
    position: relative;
    border-right: 1px solid var(--line-soft);
    background: rgba(12, 23, 34, 0.92);
    min-height: 440px;
  }
  .node-list {
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    scrollbar-width: thin;
    scrollbar-color: rgba(56, 189, 248, 0.35) rgba(8, 16, 24, 0.5);
  }
  .node-list::-webkit-scrollbar { width: 6px; }
  .node-list::-webkit-scrollbar-track { background: rgba(8, 16, 24, 0.5); }
  .node-list::-webkit-scrollbar-thumb {
    background: rgba(56, 189, 248, 0.32);
    border-radius: 999px;
  }
  .node-list::-webkit-scrollbar-thumb:hover { background: rgba(0, 229, 195, 0.6); }

  .nl-item {
    text-align: left;
    background: var(--bg-card);
    border: 1px solid rgba(56, 189, 248, 0.13);
    border-radius: 9px;
    padding: 7px 9px;
    cursor: pointer;
    font-family: inherit;
    color: var(--txt-hi);
    transition: border-color 0.14s, background 0.14s;
    flex-shrink: 0;
  }
  .nl-item:hover { border-color: var(--sky-main); }
  .nl-item.active {
    border-color: var(--mint-main);
    border-left: 3.5px solid var(--mint-main);
    background: var(--bg-elev);
    box-shadow: 0 3px 10px rgba(0, 229, 195, 0.12);
  }
  .nl-r1 {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
    gap: 4px;
  }
  .nl-code {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--mint-main);
    background: var(--mint-dim);
    padding: 0 5px;
    border-radius: 4px;
    font-family: ui-monospace, Menlo, monospace;
  }
  .nl-sec {
    font-size: 10px;
    color: var(--txt-mut);
  }
  .nl-title {
    font-size: 12px;
    font-weight: 700;
    color: #ffffff;
    margin-bottom: 2px;
  }
  .nl-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4px;
    font-size: 10.5px;
    color: var(--txt-mut);
  }
  .nl-loc {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .nl-tags {
    display: inline-flex;
    gap: 3px;
    flex-shrink: 0;
  }
  .c-dot {
    font-size: 9.5px;
    font-weight: 700;
    padding: 0 4px;
    border-radius: 4px;
    color: #06131a;
  }
  .c-dot.lulu { background: #2dd4bf; }
  .c-dot.yan { background: #38bdf8; }
  .c-dot.zhang { background: #fb7185; color: #fff; }
  .c-dot.xi { background: #c084fc; color: #fff; }
  .c-dot.qi { background: #f472b6; color: #fff; }
  .c-dot.cheng { background: #fde047; color: #111827; }
  .c-dot.app { background: #fbbf24; }

  /* Right Detail & Draggable Reader */
  .detail-pane {
    padding: 13px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: var(--bg-panel);
    min-width: 0;
  }
  .dp-top {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .dp-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
  }
  .dp-title {
    font-size: 15.5px;
    font-weight: 800;
    color: #ffffff;
  }
  .dp-nav {
    display: flex;
    gap: 5px;
    flex-shrink: 0;
  }
  .nav-btn {
    padding: 3px 9px;
    border-radius: 7px;
    border: 1px solid var(--line-soft);
    background: var(--bg-card);
    color: var(--txt-sec);
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
  }
  .nav-btn:hover {
    border-color: var(--mint-main);
    color: var(--mint-main);
  }
  .dp-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .meta-chip {
    font-size: 11px;
    color: var(--txt-sec);
    background: var(--bg-card);
    border: 1px solid rgba(56, 189, 248, 0.16);
    border-radius: 6px;
    padding: 2px 8px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  /* Adaptive K-Segment Selector */
  .seq-box {
    background: rgba(9, 17, 24, 0.72);
    border: 1px solid rgba(0, 229, 195, 0.25);
    border-radius: 10px;
    padding: 8px 10px;
    flex-shrink: 0;
  }
  .seq-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
  }
  .seq-lbl {
    font-size: 11px;
    font-weight: 800;
    color: var(--mint-main);
  }
  .full-pill {
    padding: 2px 9px;
    border-radius: 999px;
    border: 1px solid var(--line-soft);
    background: var(--bg-card);
    color: var(--txt-sec);
    font-size: 10.5px;
    font-weight: 700;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.14s;
  }
  .full-pill:hover {
    border-color: var(--sky-main);
    color: #ffffff;
  }
  .full-pill.active {
    background: var(--sky-main);
    border-color: var(--sky-main);
    color: #04151c;
    font-weight: 800;
  }
  .seq-steps {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(112px, 1fr));
    gap: 6px;
  }
  .s-step {
    text-align: left;
    background: var(--bg-card);
    border: 1.5px solid rgba(56, 189, 248, 0.16);
    border-radius: 8px;
    padding: 6px 8px;
    font-size: 11px;
    color: var(--txt-sec);
    line-height: 1.4;
    cursor: pointer;
    font-family: inherit;
    transition: all 0.14s ease;
    min-width: 0;
  }
  .s-step:hover {
    border-color: var(--sky-main);
    color: #ffffff;
  }
  .s-step.active {
    border-color: var(--mint-main);
    background: linear-gradient(155deg, rgba(0, 229, 195, 0.15) 0%, rgba(19, 39, 56, 0.95) 100%);
    color: #ffffff;
    box-shadow: 0 3px 10px rgba(0, 229, 195, 0.14);
  }
  .s-step.joined {
    border-color: rgba(56, 189, 248, 0.42);
    background: rgba(56, 189, 248, 0.09);
    color: #e2f2fa;
  }
  .ss-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 2px;
    gap: 4px;
  }
  .ss-num {
    font-size: 10.5px;
    font-weight: 800;
    color: var(--sky-main);
    font-family: ui-monospace, Menlo, monospace;
  }
  .s-step.active .ss-num { color: var(--mint-main); }
  .ss-badge {
    font-size: 9.5px;
    padding: 0 5px;
    border-radius: 4px;
    background: var(--mint-main);
    color: #041815;
    font-weight: 800;
  }
  .ss-txt {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Draggable & Resizable Preview Reader */
  .log-reader {
    background: #081018;
    border: 1px solid rgba(56, 189, 248, 0.24);
    border-radius: 10px;
    overflow: hidden;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
  }
  .lr-head {
    padding: 6px 12px;
    background: rgba(23, 43, 62, 0.72);
    border-bottom: 1px solid var(--line-soft);
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    font-size: 11px;
  }
  .lr-left, .lr-right {
    display: flex;
    align-items: center;
    gap: 7px;
  }
  .lr-pov-tag {
    font-weight: 800;
    color: var(--mint-main);
  }
  .lr-mode-pill {
    font-size: 10.5px;
    color: var(--txt-sec);
    background: rgba(15, 28, 40, 0.85);
    border: 1px solid rgba(56, 189, 248, 0.2);
    border-radius: 999px;
    padding: 1px 8px;
  }
  .pref-toggle {
    font-size: 10.5px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 999px;
    border: 1px solid rgba(56, 189, 248, 0.28);
    background: rgba(19, 35, 51, 0.8);
    color: var(--txt-sec);
    cursor: pointer;
    font-family: inherit;
  }
  .pref-toggle.active {
    border-color: rgba(0, 229, 195, 0.5);
    background: rgba(0, 229, 195, 0.14);
    color: var(--mint-main);
  }
  .pref-toggle.hidden { display: none; }
  .lr-len {
    color: var(--txt-mut);
    font-size: 10.5px;
  }

  .lr-scroll {
    height: 300px;
    min-height: 150px;
    max-height: 720px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    touch-action: pan-y;
    padding: 11px 14px 14px;
    cursor: grab;
    scrollbar-width: thin;
    scrollbar-color: rgba(0, 229, 195, 0.42) rgba(8, 16, 24, 0.7);
  }
  .lr-scroll.grabbing {
    cursor: grabbing;
    user-select: none;
    -webkit-user-select: none;
  }
  .lr-scroll::-webkit-scrollbar {
    width: 8px;
  }
  .lr-scroll::-webkit-scrollbar-track {
    background: rgba(12, 23, 34, 0.8);
  }
  .lr-scroll::-webkit-scrollbar-thumb {
    background: rgba(0, 229, 195, 0.36);
    border-radius: 999px;
    border: 2px solid rgba(12, 23, 34, 0.8);
  }
  .lr-scroll::-webkit-scrollbar-thumb:hover {
    background: rgba(0, 229, 195, 0.68);
  }

  .lr-pref {
    margin-bottom: 10px;
    padding: 7px 10px;
    background: rgba(0, 229, 195, 0.08);
    border-left: 2.5px solid var(--mint-main);
    border-radius: 6px;
    font-size: 11.5px;
    line-height: 1.56;
    color: #bde6f4;
  }
  .lr-pref.hidden { display: none; }
  .lr-pref-k {
    font-weight: 800;
    color: var(--mint-main);
    margin-right: 5px;
  }
  .lr-body {
    font-size: 13px;
    line-height: 1.76;
    color: #e2f1f8;
    white-space: pre-wrap;
  }

  .lr-resizer {
    height: 19px;
    background: rgba(15, 28, 40, 0.9);
    border-top: 1px solid rgba(56, 189, 248, 0.16);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 6px;
    cursor: ns-resize;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    color: var(--txt-mut);
    font-size: 10px;
    transition: background 0.14s, color 0.14s;
  }
  .lr-resizer:hover, .lr-resizer.dragging {
    background: rgba(0, 229, 195, 0.13);
    color: var(--mint-main);
  }
  .lr-grip {
    width: 32px;
    height: 3.5px;
    border-radius: 999px;
    background: currentColor;
    opacity: 0.65;
  }

  /* 5. Compact Bottom Dock */
  .os-dock {
    padding: 9px 16px;
    background: #0a151f;
    border-top: 1px solid var(--line-soft);
    display: flex;
    flex-direction: column;
    gap: 7px;
  }
  .note-drawer summary {
    font-size: 11.5px;
    font-weight: 600;
    color: var(--txt-sec);
    cursor: pointer;
    user-select: none;
  }
  .note-drawer summary:hover { color: var(--sky-main); }
  .note-in {
    margin-top: 6px;
    width: 100%;
    min-height: 50px;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--line-strong);
    background: var(--bg-deep);
    color: var(--txt-hi);

  function splitQuoteSpans(txt) {
    const out = [];
    const re = /(“[^”]*”|「[^」]*」)/g;
    let pos = 0;
    let m;
    while ((m = re.exec(txt)) !== null) {
      if (m.index > pos) out.push([false, txt.slice(pos, m.index)]);
      out.push([true, m[0]]);
      pos = m.index + m[0].length;
    }
    if (pos < txt.length) out.push([false, txt.slice(pos)]);
    return out;
  }

  function jsTo3rd(para) {
    const spans = splitQuoteSpans(para);
    let named = false;
    const out = [];
    for (let i = 0; i < spans.length; i++) {
      const isQ = spans[i][0];
      const chunk = spans[i][1];
      if (isQ) {
        if (chunk.indexOf("伊芸") >= 0 || chunk.indexOf("伊教授") >= 0) named = true;
        out.push(chunk);
      } else {
        const s = chunk.replace(/我们俩/g, "两人").replace(/我们/g, "她们").replace(/我自己/g, "她自己");
        let buf = "";
        for (let j = 0; j < s.length; j++) {
          const ch = s.charAt(j);
          if (ch === "我") {
            if (!named) {
              buf += "伊芸";
              named = true;
            } else {
              buf += "她";
            }
          } else {
            buf += ch;
          }
        }
        out.push(buf);
      }
    }
    return out.join("");
  }

  function jsTo2nd(para) {
    const spans = splitQuoteSpans(para);
    const out = [];
    for (let i = 0; i < spans.length; i++) {
      if (spans[i][0]) {
        out.push(spans[i][1]);
      } else {
        out.push(
          spans[i][1]
            .replace(/我们俩/g, "你们俩")
            .replace(/我们/g, "你们")
            .replace(/我自己/g, "你自己")
            .replace(/我/g, "你")
        );
      }
    }
    return out.join("");
  }

  function getSegArray(n) {
    const pack = PACK_BY_ID[n.id];
    if (!pack || !pack.s) return [];
    const useFull = n.code.indexOf("X") === 0 && curXcast === "full";
    const sf = useFull ? (pack.sf || {}) : {};
    const baseSegs = pack.s.map(function(sg, si) {
      if (!useFull) return sg;
      return sg.split("\n\n").map(function(pr, pi) {
        const key = si + ":" + pi;
        return Object.prototype.hasOwnProperty.call(sf, key) ? sf[key] : pr;
      }).join("\n\n");
    });

    if (curMode === "female") {
      const pfe = (curNpc === "erase" && pack.pfe) ? pack.pfe : {};
      const fName = cleanSingleLine(femName);
      return baseSegs.map(function(sg, si) {
        const mapped = sg.split("\n\n").map(function(pr, pi) {
          const key = si + ":" + pi;
          const p1 = Object.prototype.hasOwnProperty.call(pfe, key) ? pfe[key] : pr;
          return curFemPov === "first" ? p1 : jsTo2nd(p1);
        }).join("\n\n");
        return (curFemMode === "custom" && fName) ? swapHeroineName(mapped, fName) : mapped;
      });
    }

    const p3 = pack.p3 || {};
    const pm = pack.pm || {};
    const pe = pack.pe || {};
    const p3f = useFull ? (pack.p3f || {}) : {};
    const pmf = useFull ? (pack.pmf || {}) : {};
    const pef = useFull ? (pack.pef || {}) : {};
    const useSupremeMale = (curMode === "male" && curMaleRole === "supreme");
    const useCleanErase = (curMode === "male" && curMaleRole !== "supreme") || (curMode === "free" && curNpc === "erase");

    return baseSegs.map(function(sg, si) {
      const paras = sg.split("\n\n");
      return paras.map(function(pr, pi) {
        const key = si + ":" + pi;
        const base3 = Object.prototype.hasOwnProperty.call(p3f, key)
          ? p3f[key]
          : (Object.prototype.hasOwnProperty.call(p3, key) ? p3[key] : jsTo3rd(pr));
        if (useSupremeMale) {
          if (Object.prototype.hasOwnProperty.call(pmf, key)) return pmf[key];
          return Object.prototype.hasOwnProperty.call(pm, key) ? pm[key] : base3;
        }
        if (useCleanErase) {
          if (Object.prototype.hasOwnProperty.call(pef, key)) return pef[key];
          return Object.prototype.hasOwnProperty.call(pe, key) ? pe[key] : base3;
        }
        return base3;
      }).join("\n\n");
    });
  }

  function viewText(str) {
    if (!str) return "";
    let out = String(str);

      return out;
    }
    if (curMode === "male") {
      if (curMaleRole !== "supreme") {

        .replace(/燕芝和昊鹏/g, "燕芝与你")

  function getStepCount(n) {
    const m = getNodeMeta(n);

  function getActivePreface(n) {
    if (curStep === 0 || !showPref) return "";
    const arr = getPrefArray(n);
    const maxIdx = Math.max(0, arr.length - 1);
    const idx = Math.max(0, Math.min(maxIdx, curStep - 1));
    return arr[idx] || "";
  }

  function getActiveProse(n) {
    const arr = getSegArray(n);
    if (!arr.length) return "（正在按需载入该幕正文数据包……）";
    let base = "";
    if (curStep === 0) {
      base = arr.join("\n\n");
    } else {
      const idx = Math.max(0, Math.min(arr.length - 1, curStep - 1));
      base = arr[idx] || "";
    }

    const bucket = getSceneBucket(n.location);
    if (curMode === "free") {
      const roleObj = getFreeRoleById(curFreeRole);
      if (roleObj && roleObj.hooks) {
        const hookTxt = roleObj.hooks[bucket] || roleObj.hooks.penthouse;
        base = base.replace(/\s+$/, "") + "\n\n" + hookTxt;
      }
    } else if (curMode === "male") {
      if (curMaleRole === "supreme") {
        const nm = cleanSingleLine(maleName);
        if (nm) {
          base = base.replace(/那位手握最高VIP权限的先生/g, "手握最高VIP权限的" + nm);
        }
        if (stripQuoted(base).indexOf("你") < 0) {
          let mHook = MALE_SUPREME_NODE_HOOKS[n.code] || MALE_SUPREME_SCENE_HOOKS[bucket] || MALE_SUPREME_SCENE_HOOKS.penthouse;
          if (nm) mHook = mHook.replace(/的你/, "的" + nm + "（你）");
          base = base.replace(/\s+$/, "") + "\n\n" + mHook;
        }
      } else {
        const flexHook = buildFlexMaleHook(n, bucket);
        base = base.replace(/\s+$/, "") + "\n\n" + flexHook;
      }
    }
    return base;
  }

  (function initPreviewDrag() {
    const sc = document.getElementById("lrScroll");
    const rz = document.getElementById("lrResizer");
    const nl = document.getElementById("nodeList");

    [sc, nl].forEach(function(el) {
      el.addEventListener("touchmove", function(ev) {
        ev.stopPropagation();
      }, { passive: true });
    });

    let isDown = false;
    let isDragging = false;
    let startY = 0;
    let startTop = 0;
    let activePid = -1;

    sc.addEventListener("pointerdown", function(e) {
      if (e.pointerType !== "mouse" || e.button !== 0) return;
      const rect = sc.getBoundingClientRect();
      if (e.clientX >= rect.left + sc.clientWidth) return;
      isDown = true;
      isDragging = false;
      startY = e.clientY;
      startTop = sc.scrollTop;
      activePid = e.pointerId;
    });

    sc.addEventListener("pointermove", function(e) {
      if (!isDown || e.pointerId !== activePid) return;
      const dy = e.clientY - startY;
      if (!isDragging && Math.abs(dy) > 4) {
        isDragging = true;
        sc.classList.add("grabbing");
        try { sc.setPointerCapture(e.pointerId); } catch (err) {}
      }
      if (isDragging) {
        e.preventDefault();
        sc.scrollTop = startTop - dy;
      }
    });

    function endGrab() {
      if (!isDown) return;
      if (isDragging && activePid >= 0) {
        try { sc.releasePointerCapture(activePid); } catch (err) {}
      }
      isDown = false;
      isDragging = false;
      activePid = -1;
      sc.classList.remove("grabbing");
    }
    sc.addEventListener("pointerup", endGrab);
    sc.addEventListener("pointercancel", endGrab);
    sc.addEventListener("lostpointercapture", endGrab);
    window.addEventListener("pointerup", endGrab);
    window.addEventListener("blur", endGrab);

    let rzActive = false;
    let rzStartY = 0;
    let rzStartH = 0;
    let rzPid = -1;

    rz.addEventListener("pointerdown", function(e) {
      if (e.pointerType === "mouse" && e.button !== 0) return;
      e.preventDefault();
      rzActive = true;
      rzStartY = e.clientY;
      rzStartH = sc.getBoundingClientRect().height;
      rzPid = e.pointerId;
      rz.classList.add("dragging");
      try { rz.setPointerCapture(e.pointerId); } catch (err) {}
    });

    rz.addEventListener("pointermove", function(e) {
      if (!rzActive || e.pointerId !== rzPid) return;
      e.preventDefault();
      const nextH = Math.max(150, Math.min(720, Math.round(rzStartH + (e.clientY - rzStartY))));
      sc.style.height = nextH + "px";
    });

    function endResize() {
      if (!rzActive) return;
      if (rzPid >= 0) {
        try { rz.releasePointerCapture(rzPid); } catch (err) {}
      }
      rzActive = false;
      rzPid = -1;
      rz.classList.remove("dragging");
      saveStash();
    }
    rz.addEventListener("pointerup", endResize);
    rz.addEventListener("pointercancel", endResize);
    rz.addEventListener("lostpointercapture", endResize);
  })();

  function buildOpeningMessage(n) {
    const m = getNodeMeta(n);
    let npcPolicy = curNpc;
    if (curMode === "male") {
      npcPolicy = curMaleRole === "supreme" ? "male" : "male_flex";
    }
    let activeRole = curFreeRole;
    if (curMode === "male") {
      activeRole = curMaleRole;
    } else if (curMode === "female") {
      activeRole = curFemMode === "custom" ? "custom_fem" : "yiyun";
    }
    const femModeVal = curMode === "female" ? curFemMode : "none";
    const mName = cleanSingleLine(maleName);
    const mBio = cleanSingleLine(maleBio);
    const fName = cleanSingleLine(femName);
    const fBio = cleanSingleLine(femBio);
    const protagNameVal = curMode === "male" ? (mName || "默认") : (curMode === "female" && curFemMode === "custom" ? (fName || "自定义女主") : "默认");
    const protagBioVal = curMode === "male" ? (mBio || "默认") : (curMode === "female" && curFemMode === "custom" ? (fBio || "玩家自定义女主设定") : "默认");

    const roleObj = getFreeRoleById(curFreeRole);
    const maleRoleObj = getMaleRoleById(curMaleRole);
    const note = (document.getElementById("customNote").value || "").trim();
    const L = String.fromCharCode(60);
    const G = String.fromCharCode(62);
    const NS = "LULU_";

    let povAnchor = "";
    if (curMode === "female") {
      const eraseFemNote = npcPolicy === "erase"
        ? "本局同时启用【全女角纯净舞台】：全场互动聚焦女主、露露、燕芝、张雁及已入局随行女伴。\n"
        : "";
      if (curFemMode === "custom") {
        const dispName = fName || "自定义女主";
        const dispBio = fBio || "玩家自定义年轻精英女性人设（按备注与上下文自然展开）";
        povAnchor =
          "【视角与自定义女主最高覆写锚点】本局玩家启用『自定义女主』模式直接扮演女主人公「" + dispName + "」（第0楼" + (curFemPov === "first" ? "第一人称「我」" : "第二人称「你」") + "即玩家本人）！\n" +
          "· 自定义女主姓名：" + dispName + "\n" +
          "· 自定义外貌与人设：" + dispBio + "\n" +
          "· 覆写铁律：原著『伊芸』的姓名及冲突外貌设定已被彻底屏蔽替换！后续回复一律以沉浸式第二人称「你」向玩家呈现感官与互动，露露、燕芝、张雁、希蓉等全体NPC均自始至终以「" + dispName + "」及对应身份称呼你，严禁再冒出『伊芸 / 小芸』旧名，严禁代写玩家的台词或决定。\n" +
          eraseFemNote;
      } else {
        povAnchor = (curFemPov === "first"
          ? "【视角与人称锚点】本局玩家直接扮演原著女主「伊芸」（第0楼第一人称「我」即玩家本人）。后续回复请以第二人称「你」向玩家呈现感官体验与周围人物互动，严禁代写玩家的台词或决定。\n"
          : "【视角与人称锚点】本局玩家直接扮演原著女主「伊芸」（第0楼第二人称「你」即玩家本人）。后续回复请继续以第二人称「你」细腻呈现环境反馈与人物对手戏，严禁代写玩家的言行。\n") + eraseFemNote;
      }
    } else if (curMode === "male") {
      const mCustomLine = (mName || mBio)
        ? ("· 玩家自定义男主设定：" + (mName ? ("姓名「" + mName + "」；") : "") + (mBio ? ("人设「" + mBio + "」") : "") + "（优先级高于默认泛称，请让露露与在场女角自然贴合该姓名与身份互动）。\n")
        : "";
      povAnchor =
        "【视角与男主路线锚点】本局为男主当场互动视角（第二人称「你」指代男主玩家，伊芸及露露、燕芝、张雁、希蓉等全体女角一律使用第三人称细致刻画外貌神态；全场无任何其他男性情敌，且「你」全程亲临第一现场面对面互动，绝不异地看监控）。\n" +
        "· 当前选定男主路线：" + maleRoleObj.dossier + "\n" +
        mCustomLine;
    } else {
      const rInfo = (roleObj && roleObj.id !== "custom") ? ("玩家当前预设身份为「" + roleObj.name + "」——" + roleObj.dossier + "\n") : "";
      const npcInfo = npcPolicy === "erase"
        ? "本局已启用【全女角纯净舞台】：舞台聚焦伊芸、露露、燕芝、张雁及任何已入局同行的跨线或自拟女伴，且燕芝、张雁等女配所持有的副机权限同样可被截胡反转、与伊芸一同收服随行。\n"
        : "";
      povAnchor = "【视角与人称锚点】本局为第三人称都市沙盒介入模式：女主伊芸及所有NPC一律使用第三人称（「伊芸 / 她」）客观描写，以第二人称「你」指代玩家角色，切勿将伊芸与玩家混淆。\n" + rInfo + npcInfo;
    }

    const evs = (m.events || n.events || []).map(viewText);
    const kCount = evs.length || 3;
    const statusStep = curStep === 0 ? kCount : curStep;

    let stepAnchor = "";
    if (curStep === 0) {
      stepAnchor = "【当前子段切入锚点】玩家选择了「" + n.code + " 全节连读」开局，请紧贴本节末尾现场承接后续互动。\n";
    } else {
      const curEv = evs[curStep - 1] || "";
      const doneArr = evs.slice(0, curStep - 1).map(function(x, idx) { return n.code + "." + (idx + 1) + "（" + x + "）"; });
      const remArr = evs.slice(curStep).map(function(x, idx) { return n.code + "." + (curStep + idx + 1) + "（" + x + "）"; });
      stepAnchor =
        "【当前子段切入锚点】" +
        (doneArr.length ? ("本节前序子段 " + doneArr.join("、") + " 已作为前情发生完毕；") : "") +
        "玩家当前从子段「" + n.code + "." + curStep + "」（" + curEv + "）切入开局。" +
        (remArr.length
          ? ("本节后续子段 " + remArr.join(" → ") + " 尚未发生，请紧贴当前子段末尾现场细腻承接互动，循序渐进推演，切勿单轮跳完。\n")
          : "当前为本节收尾子段，请紧贴末尾现场充分展开对手戏与余韵，未收到【阶段推进确认】前切勿擅自跨入下一节点。\n");
    }

    let xcastAnchor = "";
    if (n.code.indexOf("X") === 0 || (note && note.indexOf("希蓉") >= 0)) {
      xcastAnchor = curXcast === "solo"
        ? "【星使彩蛋阵容策略：仅保留希蓉（精简人数模式）】跨书彩蛋支线人物仅限阿斯兰蒂公使「希蓉」一人登场（不自动刷出其他未点名彩蛋配角，主线女角与玩家引入角色正常保留），且希蓉一旦入局，后续跨幕推进须全程合理随行同场，严禁切幕清退。\n"
        : "【星使彩蛋阵容策略：全彩蛋阵容】除异星公使「希蓉」外，可按场景自然联动当红旗袍女歌星「琪琪」、粉裙学姐「程欣然」与电子社少女「程孜然」，全员支持子母副端同调且入局后跨幕全程随行不断档。\n";
    }

    let initCompanions = "无";
    if (n.code.indexOf("X") === 0) {
      if (curXcast === "full") {
        const extraNames = ["希蓉"];
        const cks = (m.char_keys || []).join(" ");
        ["琪琪", "程欣然", "程孜然"].forEach(function(nm) {
          if (cks.indexOf(nm) >= 0 && extraNames.indexOf(nm) < 0) extraNames.push(nm);
        });
        initCompanions = extraNames.join("、") + "（同场随行·子母副端联动）";
      } else {
        initCompanions = "希蓉（阿斯兰蒂公使·二号副耳钉同场随行）";
      }
    } else if (note && note.indexOf("希蓉") >= 0) {
      initCompanions = "希蓉（阿斯兰蒂公使·二号副耳钉同场随行）";
    }

    const hidden =
      L + 'div style="display' + ':none"' + G + "\n" +
      "【开局阶段" + "触发键】\n" +
      OB + OB + NS + "OPENING:" + n.code + CB + CB + "\n" +
      OB + OB + NS + "STAGE:" + n.code + CB + CB + "\n" +
      OB + OB + NS + "STEP:" + statusStep + CB + CB + "\n" +
      OB + OB + NS + "VIEW:" + curMode + CB + CB + "\n" +
      OB + OB + NS + "NPC:" + npcPolicy + CB + CB + "\n" +
      OB + OB + NS + "ROLE:" + activeRole + CB + CB + "\n" +
      OB + OB + NS + "FEM:" + femModeVal + CB + CB + "\n" +
      OB + OB + NS + "XCAST:" + curXcast + CB + CB + "\n" +
      povAnchor +
      xcastAnchor +
      stepAnchor +
      (note ? "【玩家自定义补充备注】\n" + note + "\n" : "") +
      "【/开局阶段" + "触发键】\n" +
      L + "/div" + G + "\n\n";

    const prefStr = getActivePreface(n);
    const proseBlock = (curStep > 0 && prefStr)
      ? (G + " **【前情提要】** " + prefStr + "\n\n" + getActiveProse(n))
      : getActiveProse(n);

    const activeLoc = m.location || n.location;
    const sOpen = OB + NS + "STATUS" + CB;
    const sClose = OB + "/" + NS + "STATUS" + CB;
    const status =
      "\n\n" + sOpen + "\n" +
      "stage: " + n.code + "\n" +
      "step: " + statusStep + "\n" +
      "stage_title: " + viewText(m.short_title) + "\n" +
      "location: " + activeLoc + "\n" +
      "attire_state: " + viewText(m.yi_equipment) + "\n" +
      "bond_mental: " + viewText(m.yi_mental) + "\n" +
      "companions: " + initCompanions + "\n" +
      "stage_key: " + OB + OB + NS + "STAGE:" + n.code + CB + CB + "\n" +
      "opening_key: " + OB + OB + NS + "OPENING:" + n.code + CB + CB + "\n" +
      "view: " + curMode + "\n" +
      "view_key: " + OB + OB + NS + "VIEW:" + curMode + CB + CB + "\n" +
      "role: " + activeRole + "\n" +
      "role_key: " + OB + OB + NS + "ROLE:" + activeRole + CB + CB + "\n" +
      "fem_mode: " + femModeVal + "\n" +
      "fem_key: " + OB + OB + NS + "FEM:" + femModeVal + CB + CB + "\n" +
      "protag_name: " + protagNameVal + "\n" +
      "protag_bio: " + protagBioVal + "\n" +
      "npc_policy: " + npcPolicy + "\n" +
      "npc_key: " + OB + OB + NS + "NPC:" + npcPolicy + CB + CB + "\n" +
      "xcast: " + curXcast + "\n" +
      "xcast_key: " + OB + OB + NS + "XCAST:" + curXcast + CB + CB + "\n" +
      "next_stage: " + (n.next_code || "") + "\n" +
      "next_title: " + viewText(m.next_title || "") + "\n" +
      "advance_id: " + (n.next_code ? n.code + "_TO_" + n.next_code : "") + "\n" +
      "can_advance: " + (n.next_code ? "true" : "false") + "\n" +
      sClose;

    return hidden + proseBlock + status;
  }

  document.getElementById("goBtn").addEventListener("click", async function() {
    const n = CATALOG[selectedId] || CATALOG[0];
    if (!PACK_BY_ID[n.id]) {
      await switchArcPack(n.arc_id, curArc, n.id, curStep);
      return;
    }
    const msg = buildOpeningMessage(n);
    try { if (window.parent) window.parent.__luluPanelStash = null; } catch (e) {}
    const info = document.getElementById("dockMsg");
    const label = curStep === 0 ? n.code : (n.code + "." + curStep);
    try {
      if (typeof setChatMessages === "function") {
        await setChatMessages([{ message_id: 0, message: msg }]);
        info.textContent = "✓ 已载入 " + label + " 开局";
        return;
      }
      const p = window.parent;
      if (p && typeof p.setChatMessages === "function") {
        await p.setChatMessages([{ message_id: 0, message: msg }]);
        info.textContent = "✓ 已载入 " + label + " 开局";
        return;
      }
      if (p && p.SillyTavern && typeof p.SillyTavern.getContext === "function") {
        const ctx = p.SillyTavern.getContext();
        if (ctx && Array.isArray(ctx.chat) && ctx.chat.length > 0) {
          ctx.chat[0].mes = msg;
          if (typeof ctx.saveChat === "function") await ctx.saveChat();
          if (typeof ctx.reloadCurrentChat === "function") await ctx.reloadCurrentChat();
          info.textContent = "✓ 已切换至 " + label;
          return;
        }
      }
      await navigator.clipboard.writeText(msg);
      info.textContent = "已复制 " + label + " 开局内容至剪贴板";
    } catch (err) {
      info.textContent = "提示：" + String(err);
    }
  });

  restoreStash();
  syncToolbarState();
  renderRoleGrid();
  renderMaleRoleGrid();
  renderArcPills();
  renderList();
  renderDetail(true);
})();
</script>
